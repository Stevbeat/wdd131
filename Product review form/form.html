<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Share your experience with a product in this product review form.">
    <meta name="author" content="Stephen Otoo-Yirenkyi">
    <title>Product Review | WDD 131</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Montserrat:wght@500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../styles/review-form.css">
    <script src="../scripts/products.js" defer></script>
    <script src="../scripts/review-form.js" defer></script>
</head>

<body>
    <a class="skip-link" href="#main-content">Skip to main content</a>
    <header class="site-header">
        <p class="eyebrow">WDD 131 · Product feedback</p>
        <h1>Product Review</h1>
        <p class="header-intro">Tell us how your product is working for you.</p>
    </header>

    <main id="main-content">
        <form class="review-form" method="get" action="review.html">
            <div class="field">
                <label for="product">Product name</label>
                <select id="product" name="product" required>
                    <option value="" disabled selected>Select a Product ...</option>
                </select>
            </div>

            <fieldset class="rating-field">
                <legend>Overall rating</legend>
                <div class="rating-options">
                    <div class="rating-option">
                        <input id="rating-1" name="rating" type="radio" value="1" required>
                        <label for="rating-1" aria-label="1 star"><span aria-hidden="true">★</span><span
                                class="sr-only">1 star</span></label>
                    </div>
                    <div class="rating-option">
                        <input id="rating-2" name="rating" type="radio" value="2" required>
                        <label for="rating-2" aria-label="2 stars"><span aria-hidden="true">★★</span><span
                                class="sr-only">2 stars</span></label>
                    </div>
                    <div class="rating-option">
                        <input id="rating-3" name="rating" type="radio" value="3" required>
                        <label for="rating-3" aria-label="3 stars"><span aria-hidden="true">★★★</span><span
                                class="sr-only">3 stars</span></label>
                    </div>
                    <div class="rating-option">
                        <input id="rating-4" name="rating" type="radio" value="4" required>
                        <label for="rating-4" aria-label="4 stars"><span aria-hidden="true">★★★★</span><span
                                class="sr-only">4 stars</span></label>
                    </div>
                    <div class="rating-option">
                        <input id="rating-5" name="rating" type="radio" value="5" required>
                        <label for="rating-5" aria-label="5 stars"><span aria-hidden="true">★★★★★</span><span
                                class="sr-only">5 stars</span></label>
                    </div>
                </div>
            </fieldset>

            <div class="field">
                <label for="installation-date">Date of installation</label>
                <input id="installation-date" name="installationDate" type="date" required>
            </div>

            <fieldset class="features-field">
                <legend>Which features did you find useful?</legend>
                <p class="field-hint">Select all that apply.</p>
                <div class="checkbox-list">
                    <label class="checkbox-option" for="feature-durability">
                        <input id="feature-durability" name="features" type="checkbox" value="Durability">
                        <span>Durability</span>
                    </label>
                    <label class="checkbox-option" for="feature-ease-of-use">
                        <input id="feature-ease-of-use" name="features" type="checkbox" value="Ease of Use">
                        <span>Ease of use</span>
                    </label>
                    <label class="checkbox-option" for="feature-performance">
                        <input id="feature-performance" name="features" type="checkbox" value="Performance">
                        <span>Performance</span>
                    </label>
                    <label class="checkbox-option" for="feature-design">
                        <input id="feature-design" name="features" type="checkbox" value="Design">
                        <span>Design</span>
                    </label>
                </div>
            </fieldset>

            <div class="field">
                <label for="written-review">Written review <span class="optional">(optional)</span></label>
                <textarea id="written-review" name="writtenReview" rows="5"></textarea>
            </div>

            <div class="field">
                <label for="user-name">Your name <span class="optional">(optional)</span></label>
                <input id="user-name" name="userName" type="text" autocomplete="name">
            </div>

            <button class="submit-button" type="submit">Post review</button>
        </form>
    </main>

    <footer class="site-footer">
        <p>&copy; <span id="currentyear"></span> Stephen Otoo-Yirenkyi <span class="footer-divider">•</span> Ghana</p>
        <p id="lastModified"></p>
    </footer>
</body>

</html>
