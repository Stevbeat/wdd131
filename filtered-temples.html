<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A responsive temple album with interactive filters for temple dedication dates and sizes.">
    <meta name="author" content="Stephen Otoo-Yirenkyi">
    <title>Filtered Temple Album | Stephen Otoo-Yirenkyi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Montserrat:wght@500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles/filtered-temples.css">
    <link rel="stylesheet" href="styles/filtered-temples-large.css">
    <script src="scripts/filtered-temples.js" defer></script>
</head>

<body>
    <header class="site-header">
        <a class="site-title" href="#home">Temple Album</a>
        <button class="menu-toggle" type="button" aria-label="Open menu" aria-expanded="false"
            aria-controls="primary-nav">
            <span aria-hidden="true">☰</span>
        </button>
        <nav class="primary-nav" id="primary-nav" aria-label="Main navigation">
            <a href="#home" data-filter="all">Home</a>
            <a href="#temples" data-filter="old">Old</a>
            <a href="#temples" data-filter="new">New</a>
            <a href="#temples" data-filter="large">Large</a>
            <a href="#temples" data-filter="small">Small</a>
        </nav>
    </header>

    <main id="home">
        <h1 id="page-title">Home</h1>
        <section class="temple-grid" id="temples" aria-label="Temple listings" aria-live="polite"></section>
    </main>

    <footer>
        <p>&copy; <span id="currentyear"></span> Stephen Otoo-Yirenkyi <span class="footer-divider">•</span> Ghana</p>
        <p id="lastModified"></p>
    </footer>
</body>

</html>
